name: Check IceBuoys app

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2

      - name: Parse R application files
        run: Rscript -e 'parse(file = "app.R"); parse(file = "install_packages.R")'

      - name: Compile Python ingestion script
        run: python -m py_compile scripts/fetch_licor.py
