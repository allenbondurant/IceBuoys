name: Update IceBuoys LI-COR observations

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"

permissions:
  contents: write

concurrency:
  group: update-licor-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ingestion dependencies
        run: pip install -r requirements.txt

      - name: Fetch observations
        env:
          LICOR_API_TOKEN: ${{ secrets.LICOR_API_TOKEN }}
          LICOR_LOGGER_SN: "22188604"
        run: python scripts/fetch_licor.py

      - name: Commit updated data
        run: |
          git config user.name "icebuoys-data-bot"
          git config user.email "icebuoys-data-bot@users.noreply.github.com"
          git add data/licor_observations.csv
          if git diff --cached --quiet; then
            echo "No new LI-COR observations"
          else
            git commit -m "Update LI-COR observations"
            git push
          fi
